name: Traffic Simulator

# Genera tráfico sintético en la demo TechFlow para poblar GA4.
# - Programado: una vez al día (con jitter interno de 1–3 sesiones).
# - Manual: botón "Run workflow" en la pestaña Actions.
on:
  schedule:
    # 14:07 UTC diario. Nota: los cron de Actions pueden retrasarse en
    # horas pico y se desactivan tras 60 días sin actividad en el repo.
    - cron: '7 14 * * *'
  workflow_dispatch:

jobs:
  simulate:
    # Imagen fijada a propósito. `ubuntu-latest` migra a Ubuntu 26 el
    # 2026-10-19; un cambio de imagen puede alterar las librerías del sistema
    # de las que depende el Chromium de Playwright. El bot corre a diario sin
    # supervisión: una ruptura aquí se traduce en días sin datos en GA4 antes
    # de que alguien lo note.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      # Sin --with-deps a propósito: esa opción lanza `apt-get update`, que en
      # el runner incluye el repositorio de Google Chrome. Cuando ese repo
      # sirve un índice inconsistente ("Hash Sum mismatch") apt falla y el job
      # entero se cae, aunque el navegador no tenga nada que ver.
      # La imagen ubuntu-latest ya trae Chrome y Edge preinstalados, así que
      # las librerías compartidas que necesita el Chromium de Playwright están
      # presentes: solo hace falta descargar el binario.
      - name: Instalar navegador Playwright
        run: npx playwright install chromium

      - name: Ejecutar simulador
        run: node traffic-sim.mjs
